<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SDFGI Race Repro</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
        h1 { color: #4fc3f7; font-size: 1.2em; }
        #status { margin: 12px 0; padding: 8px; background: #16213e; border-radius: 4px; }
        #status.pass { border-left: 3px solid #4caf50; }
        #status.fail { border-left: 3px solid #f44336; }
        #status.running { border-left: 3px solid #ff9800; }
        table { border-collapse: collapse; font-size: 0.85em; }
        td, th { padding: 4px 10px; border: 1px solid #333; text-align: right; }
        th { color: #4fc3f7; }
        .diverged { color: #f44336; font-weight: bold; }
        .ok { color: #4caf50; }
    </style>
</head>
<body>
    <h1>SDFGI same-texel read-modify-write race — minimal WebGPU repro</h1>
    <p>Not Godot. See webgpu_notes/TASKS.md Task 9.5 Round 38-39 / plan-of-attack.md Tier 1 Phase 1.</p>
    <div id="status">Ready.</div>
    <table id="results"><thead><tr><th>slack</th><th>calls</th><th>expected</th><th>actual</th><th>result</th></tr></thead><tbody></tbody></table>

    <script type="module">
        import { runRace } from './race_repro.js';

        window.testResults = null;

        async function main() {
            const statusEl = document.getElementById('status');
            const tbody = document.querySelector('#results tbody');
            statusEl.className = 'running';
            statusEl.textContent = 'Running...';

            const params = new URLSearchParams(location.search);
            const slackValues = params.has('slack')
                ? params.get('slack').split(',').map(Number)
                : [0, 1, 2, 4, 8, 16, 32];
            const callsPerSlack = params.has('calls') ? Number(params.get('calls')) : 500;

            try {
                const result = await runRace({ slackValues, callsPerSlack });
                window.testResults = result;

                for (const r of result.results) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.slack}</td><td>${r.calls}</td><td>${r.expected}</td><td>${r.actual}</td>` +
                        `<td class="${r.diverged ? 'diverged' : 'ok'}">${r.diverged ? 'DIVERGED' : 'ok'}</td>`;
                    tbody.appendChild(tr);
                }

                statusEl.className = result.reproduced ? 'fail' : 'pass';
                statusEl.textContent = result.reproduced
                    ? `REPRODUCED — hazard-tracking divergence seen at slack(s): ${result.results.filter(r => r.diverged).map(r => r.slack).join(', ')}`
                    : 'Not reproduced — all slack values matched expected value exactly.';
            } catch (err) {
                window.testResults = { error: String(err && err.stack || err) };
                statusEl.className = 'fail';
                statusEl.textContent = 'ERROR: ' + err;
                throw err;
            }
        }

        if (new URLSearchParams(location.search).has('autorun')) {
            main();
        }
        window.runMain = main;
    </script>
</body>
</html>
