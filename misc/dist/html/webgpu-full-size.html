<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

/* The export preset's progress bar colors (loading_screen/progress_bar/*), set
   as custom properties by the script below because inline styles cannot reach
   the pseudo-elements that draw a <progress>. Only added when a color differs
   from its default; otherwise the bar keeps the browser's native look. */
#status-progress.custom-colors {
	-webkit-appearance: none;
	appearance: none;
	box-sizing: border-box;
	height: 1rem;
	border: 1px solid var(--progress-border-color);
	border-radius: 0.5rem;
	background-color: var(--progress-background-color);
	overflow: hidden;
}

#status-progress.custom-colors::-webkit-progress-bar {
	background-color: transparent;
}

#status-progress.custom-colors::-webkit-progress-value {
	background-color: var(--progress-fill-color);
}

#status-progress.custom-colors::-moz-progress-bar {
	background-color: var(--progress-fill-color);
}

/* No value yet (download size unknown): a block of the fill color sweeps
   across, as the native indeterminate bar does. */
#status-progress.custom-colors:indeterminate {
	background-image: linear-gradient(var(--progress-fill-color), var(--progress-fill-color));
	background-repeat: no-repeat;
	background-size: 30% 100%;
	animation: status-progress-indeterminate 1.5s linear infinite;
}

#status-progress.custom-colors:indeterminate::-moz-progress-bar {
	background-color: transparent;
}

@keyframes status-progress-indeterminate {
	from { background-position: -50% 0; }
	to { background-position: 150% 0; }
}

/* The start screen's button (html/start_button/*). Its look comes from the
   export preset as custom properties set by the script below; hover and
   pressed are darker shades of the background unless the preset sets its own. */
#status-start {
	display: none;
	flex: none;
	box-sizing: border-box;
	cursor: pointer;
	background-color: var(--start-background-color);
	color: var(--start-text-color);
	border: var(--start-border-width) solid var(--start-border-color);
	border-radius: var(--start-border-radius);
	font-family: var(--start-font-family);
	font-size: var(--start-font-size);
	line-height: 1.2;
	padding: var(--start-padding-vertical) var(--start-padding-horizontal);
	z-index: 1;
}

#status-start:hover {
	background-color: var(--start-hover-color);
}

#status-start:active {
	background-color: var(--start-pressed-color);
}

#status-start:focus-visible {
	outline: 2px solid var(--start-text-color);
	outline-offset: 3px;
}

/* Under the button while the game downloads behind the start screen
   (html/start_button/preload_progress): "Downloading 48%", then "Ready". The
   messages, color, font and size come from html/start_button/preload_text/*;
   these are those options' defaults. Drawn at full opacity, so the color shows
   as picked: the default color and shadow are what #e0e0e0 and a 0.6 shadow at
   the old 85% opacity gave over the default splash background. Its own
   compositing layer (will-change) keeps the grayscale antialiasing that opacity
   gave it in Chrome, which otherwise draws opaque text with color fringes
   (subpixel antialiasing). A message switched off leaves the line empty, and
   min-height keeps its space so nothing moves. */
#status-preload {
	display: none;
	flex: none;
	min-height: 1.3em;
	color: #c4c4c4;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.9rem;
	line-height: 1.3;
	text-align: center;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.51);
	will-change: transform;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<button id="status-start" type="button"></button>
			<div id="status-preload" aria-live="polite"></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// The preset's progress bar options (loading_screen/progress_bar/*): { enabled,
// customColors, borderColor, backgroundColor, fillColor }, colors as CSS hex.
const GODOT_PROGRESS_BAR = $GODOT_PROGRESS_BAR;

/**
 * Pre-initialize the WebGPU device before the Godot WASM module starts.
 * This is required because emscripten_webgpu_get_device() in C++ retrieves
 * the device synchronously from Module['preinitializedWebGPUDevice'], which
 * must be set before the WASM main() function runs.
 *
 * @returns {Promise<?GPUDevice>} The initialized device, or null if unavailable.
 */
async function initWebGPU() {
	if (typeof navigator.gpu === 'undefined') {
		console.warn('WebGPU not supported in this browser. See https://caniuse.com/webgpu for support information.');
		return null;
	}

	let adapter;
	try {
		adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
	} catch (e) {
		console.warn('WebGPU: Failed to request adapter:', e);
		return null;
	}
	if (!adapter) {
		console.warn('WebGPU: No GPU adapter available (hardware or driver not supported).');
		return null;
	}

	// Log adapter info for debugging.
	const adapterInfo = adapter.info || {};
	console.info('WebGPU adapter:', adapterInfo.description || adapterInfo.vendor || '(unknown)');

	// Request optional features that Godot can use if available.
	const wantedFeatures = [
		'texture-compression-bc',
		'texture-compression-etc2',
		'texture-compression-astc',
		'depth-clip-control',
		'depth32float-stencil8',
		'indirect-first-instance',
		'rg11b10ufloat-renderable',
		'bgra8unorm-storage',
		'float32-filterable',
	];
	const requiredFeatures = wantedFeatures.filter((f) => adapter.features.has(f));

	// Request limits that Godot's renderer needs.
	const requiredLimits = {};
	const wantedLimits = {
		maxTextureDimension2D: 16384,
		maxTextureArrayLayers: 2048,
		maxBindGroups: 4,
		maxBindingsPerBindGroup: 640,
		maxDynamicUniformBuffersPerPipelineLayout: 8,
		maxDynamicStorageBuffersPerPipelineLayout: 4,
		maxSampledTexturesPerShaderStage: 16,
		maxSamplersPerShaderStage: 16,
		maxStorageBuffersPerShaderStage: 8,
		maxStorageTexturesPerShaderStage: 4,
		maxUniformBuffersPerShaderStage: 12,
		maxUniformBufferBindingSize: 65536,
		maxStorageBufferBindingSize: 134217728,
		maxVertexBuffers: 8,
		maxVertexAttributes: 16,
		maxColorAttachments: 8,
	};
	for (const [limit, value] of Object.entries(wantedLimits)) {
		if (limit in adapter.limits) {
			requiredLimits[limit] = Math.min(value, adapter.limits[limit]);
		}
	}

	let device;
	try {
		device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
	} catch (e) {
		console.warn('WebGPU: Failed to request device:', e);
		return null;
	}

	device.lost.then((info) => {
		console.error('WebGPU device lost:', info.reason, info.message);
	});

	console.info('WebGPU device ready. Features:', [...device.features].join(', ') || '(none)');
	return device;
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	const progressBar = (typeof GODOT_PROGRESS_BAR === 'object' && GODOT_PROGRESS_BAR) || {};
	const progressBarEnabled = progressBar['enabled'] !== false;
	if (progressBar['customColors']) {
		statusProgress.style.setProperty('--progress-border-color', progressBar['borderColor']);
		statusProgress.style.setProperty('--progress-background-color', progressBar['backgroundColor']);
		statusProgress.style.setProperty('--progress-fill-color', progressBar['fillColor']);
		statusProgress.classList.add('custom-colors');
	}

	// The start screen (html/start_button/*, GODOT_CONFIG.startButton): the page
	// waits on this button, and nothing of the engine runs until it is pressed.
	const statusStart = document.getElementById('status-start');
	const startButton = GODOT_CONFIG['startButton'] || {};
	// While the start screen waits, the files the game needs download in the background
	// (html/start_button/preload, Engine.prototype.prefetch()), so after the press only the
	// engine's own startup is left. Not in the browser's Save-Data mode: the download then
	// waits for the press, as without the option. This has to run in the game's own page:
	// browsers keep a separate HTTP cache for each site that embeds a page, so a parent
	// page fetching the same files would not speed up a cross-origin iframe of the game.
	const connection = navigator.connection;
	const preload = !!(startButton['enabled'] && startButton['preload']) && !(connection && connection.saveData);
	const preloadProgress = preload && !!startButton['preloadProgress'];
	const statusPreload = document.getElementById('status-preload');
	// The line's messages, color and font (html/start_button/preload_text/*). A config without them
	// (a custom shell's, or one written before they existed) gets the defaults; an empty
	// message is one switched off, and leaves the line empty in that state.
	const preloadText = startButton['preloadText'] || {};
	const preloadMessage = (key, fallback) => (typeof preloadText[key] === 'string' ? preloadText[key] : fallback);
	const preloadDownloadingText = preloadMessage('downloading', 'Downloading...');
	const preloadProgressText = preloadMessage('progress', 'Downloading {percent}%');
	const preloadReadyText = preloadMessage('ready', 'Ready');
	if (preloadText['color']) {
		statusPreload.style.color = preloadText['color'];
	}
	if (preloadText['fontFamily']) {
		statusPreload.style.fontFamily = preloadText['fontFamily'];
	}
	if (preloadText['fontSize'] > 0) {
		statusPreload.style.fontSize = `${preloadText['fontSize']}px`;
	}
	if (startButton['enabled']) {
		statusStart.textContent = startButton['text'] || 'Start';
		const startStyle = {
			'--start-background-color': startButton['backgroundColor'],
			'--start-hover-color': startButton['hoverColor'],
			'--start-pressed-color': startButton['pressedColor'],
			'--start-text-color': startButton['textColor'],
			'--start-border-color': startButton['borderColor'],
			'--start-border-width': `${startButton['borderWidth']}px`,
			'--start-border-radius': `${startButton['borderRadius']}px`,
			'--start-font-family': startButton['fontFamily'],
			'--start-font-size': `${startButton['fontSize']}px`,
			'--start-padding-horizontal': `${startButton['paddingHorizontal']}px`,
			'--start-padding-vertical': `${startButton['paddingVertical']}px`,
		};
		Object.entries(startStyle).forEach(([name, value]) => {
			statusStart.style.setProperty(name, value);
		});
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = (mode === 'progress' && progressBarEnabled) ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusStart.style.display = mode === 'start' ? 'block' : 'none';
		statusPreload.style.display = (mode === 'start' && preloadProgress) ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Declared here (not just inside the WebGPU pre-init branch below) so the
	// missing-features path can still call installServiceWorker() on it.
	let engine = new Engine(GODOT_CONFIG);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
		webgl: false, // WebGPU-only page: skip the WebGL2 probe (~110 ms)
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// The startup, run at once or when the start screen's button is pressed.
		function startEngine() {
			setStatusMode('progress');

			// Pre-initialize WebGPU device before starting the engine.
			// The device must be available when the WASM module boots so that
			// emscripten_webgpu_get_device() can return it synchronously.
			initWebGPU().then((webgpuDevice) => {
				const engineConfig = { ...GODOT_CONFIG };
				if (webgpuDevice) {
					engineConfig['preinitializedWebGPUDevice'] = webgpuDevice;
				} else {
					// No WebGPU device — the engine will fall back to gl_compatibility
					// if opengl3=yes was also compiled in. Otherwise it will fail at init.
					console.warn('WebGPU unavailable, engine will attempt fallback.');
				}

				engine = new Engine(engineConfig);
				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							statusProgress.value = current;
							statusProgress.max = total;
						} else {
							statusProgress.removeAttribute('value');
							statusProgress.removeAttribute('max');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
				}, displayFailureNotice);
			}).catch(displayFailureNotice);
		}

		// The start screen: wait for the player instead of starting straight away.
		// The button is not focused here: inside an iframe, that would scroll the
		// parent page to the game. A <button> takes Enter and Space once focused.
		if (startButton['enabled']) {
			setStatusMode('start');
			statusStart.addEventListener('click', () => {
				statusStart.disabled = true;
				startEngine();
			}, { once: true });
			if (preload) {
				// A press before this finishes carries on with the same downloads.
				let shownPercent = 0;
				let preloadFinished = false;
				statusPreload.textContent = preloadDownloadingText;
				engine.prefetch((loaded, total) => {
					if (total > 0 && !preloadFinished) {
						// Never backwards: the texture pack joins the total once the adapter is known.
						shownPercent = Math.max(shownPercent, Math.min(99, Math.floor((loaded / total) * 100)));
						// Every {percent} becomes the number; a text without one is shown as it is.
						statusPreload.textContent = preloadProgressText.split('{percent}').join(String(shownPercent));
					}
				}).then((complete) => {
					preloadFinished = true;
					// A file that failed is downloaded again on the press, so there is nothing to report.
					statusPreload.textContent = complete ? preloadReadyText : '';
				});
			}
		} else {
			startEngine();
		}
	}
}());
		</script>
	</body>
</html>
