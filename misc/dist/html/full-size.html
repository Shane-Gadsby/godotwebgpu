<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	/* Centered and scaled to fill as much of the viewport as possible while
	preserving aspect ratio -- see fitCanvasToViewport() below, which sets
	position/left/top/transform on this element at runtime. Deliberately
	NOT done via `object-fit: contain` on a width:100vw/height:100vh box:
	object-fit visually letterboxes the rendered content *inside* the
	element's box without shrinking the box itself, so canvas.getBoundingClientRect()
	(which platform/web/js/libs/library_godot_input.js's mouse/touch handlers use
	to map event coordinates into canvas space) would keep reporting the full,
	un-letterboxed box -- misaligning every click/tap by the letterbox gap.
	A CSS `transform: scale()` instead visually scales the element as a whole,
	so its bounding rect always matches exactly what's on screen and input
	mapping needs no changes. */
}

#canvas:focus {
	outline: none;
}

/* The loading screen is one centered column -- splash image, spinner, status
   text, progress bar -- with the same gap between every neighbor. The chrome
   used to be pinned to the bottom 10% of the viewport with absolute offsets,
   which left it floating an arbitrary distance under the logo; here the whole
   group is centered as a unit and `gap` spaces it. Elements a stage hides keep
   their box (visibility, not display), so the bar never jumps between stages;
   see showStage() for the exception when no stage ever shows an element. */
#status {
	position: absolute;
	inset: 0;
	box-sizing: border-box;
	padding: 1rem;
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1rem;
	visibility: hidden;
}

/* A flex item that may shrink (min-height: 0) so that the chrome below it
   always fits; object-fit keeps the picture's aspect when it does. */
#status-splash {
	max-height: 100%;
	max-width: 100%;
	min-height: 0;
	flex: 0 1 auto;
	object-fit: contain;
}

#status-splash.show-image--false {
	display: none;
}

/* Full width with the height following the picture's own aspect ratio (not
   height: 100%, which would make the box fill the viewport and leave the chrome
   an arbitrary distance under the letterboxed picture); the flex shrink above
   takes care of the case where that is taller than the space left. */
#status-splash.fullsize--true {
	width: 100%;
	height: auto;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: 50%;
	max-width: 30rem;
	flex: none;
}

/* The export preset's progress bar colors (loading_screen/progress_bar/*), set
   as custom properties by the script below because inline styles cannot reach
   the pseudo-elements that draw a <progress>. Only added when a color differs
   from its default; otherwise the bar keeps the browser's native look. */
#status-progress.custom-colors {
	-webkit-appearance: none;
	appearance: none;
	box-sizing: border-box;
	height: 1rem;
	border: 1px solid var(--progress-border-color);
	border-radius: 0.5rem;
	background-color: var(--progress-background-color);
	overflow: hidden;
}

#status-progress.custom-colors::-webkit-progress-bar {
	background-color: transparent;
}

#status-progress.custom-colors::-webkit-progress-value {
	background-color: var(--progress-fill-color);
}

#status-progress.custom-colors::-moz-progress-bar {
	background-color: var(--progress-fill-color);
}

/* No value yet (download size unknown): a block of the fill color sweeps
   across, as the native indeterminate bar does. */
#status-progress.custom-colors:indeterminate {
	background-image: linear-gradient(var(--progress-fill-color), var(--progress-fill-color));
	background-repeat: no-repeat;
	background-size: 30% 100%;
	animation: status-progress-indeterminate 1.5s linear infinite;
}

#status-progress.custom-colors:indeterminate::-moz-progress-bar {
	background-color: transparent;
}

@keyframes status-progress-indeterminate {
	from { background-position: -50% 0; }
	to { background-position: 150% 0; }
}

/* The start screen's button (html/start_button/*). Its look comes from the
   export preset as custom properties set by the script below; hover and
   pressed are darker shades of the background unless the preset sets its own. */
#status-start {
	display: none;
	flex: none;
	box-sizing: border-box;
	cursor: pointer;
	background-color: var(--start-background-color);
	color: var(--start-text-color);
	border: var(--start-border-width) solid var(--start-border-color);
	border-radius: var(--start-border-radius);
	font-family: var(--start-font-family);
	font-size: var(--start-font-size);
	line-height: 1.2;
	padding: var(--start-padding-vertical) var(--start-padding-horizontal);
}

#status-start:hover {
	background-color: var(--start-hover-color);
}

#status-start:active {
	background-color: var(--start-pressed-color);
}

#status-start:focus-visible {
	outline: 2px solid var(--start-text-color);
	outline-offset: 3px;
}

/* Names the phase the engine is working through. Deliberately styled as neutral
   chrome, not like #status-notice, which is the red error box -- "Loading main
   scene" is not a problem report. Reserves one line while hidden. */
#status-label {
	flex: none;
	min-height: 1.3em;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.9rem;
	line-height: 1.3;
	opacity: 0.85;
	text-align: center;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
	visibility: hidden;
}

#status-label.visible {
	visibility: visible;
}

/* No stage of this export ever shows the element: drop it from the layout
   entirely so the rest of the column closes up around it. */
#status-label.unused, #webgpu-spinner.unused {
	display: none;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Purely CSS-driven (transform only, no JS) so the browser's compositor thread
   keeps it spinning even while the main JS thread is blocked for seconds at a
   time -- which, on WebGPU, it genuinely is: the engine's first rendered frame
   runs synchronously inside the WASM callMain() call, before control ever
   returns to JS, so nothing JS-driven (progress text, event listeners) can
   paint during that window. This spinner is the only feedback that can. */
#webgpu-spinner {
	flex: none;
	box-sizing: border-box;
	width: 1.5rem;
	height: 1.5rem;
	border-radius: 50%;
	border: 3px solid rgba(255, 255, 255, 0.25);
	border-top-color: #e0e0e0;
	animation: webgpu-spin 0.8s linear infinite;
	visibility: hidden;
}

#webgpu-spinner.visible {
	visibility: visible;
}

@keyframes webgpu-spin {
	to {
		transform: rotate(360deg);
	}
}

/* Shown if the WebGPU device is lost mid-session (e.g. a GPU crash/reset).
   Separate from #status above since that overlay is removed from the DOM
   once startup finishes -- this can fire well after the game is running. */
#webgpu-device-lost {
	display: none;
	position: fixed;
	inset: 0;
	background-color: rgba(0, 0, 0, 0.75);
	z-index: 2;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

#webgpu-device-lost-box {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem 1.5rem;
	text-align: center;
	max-width: 30rem;
}

#webgpu-device-lost-reload {
	margin-top: 0.75rem;
	padding: 0.4rem 1.2rem;
	cursor: pointer;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="webgpu-spinner"></div>
			<div id="status-label"></div>
			<progress id="status-progress"></progress>
			<button id="status-start" type="button"></button>
			<div id="status-notice"></div>
		</div>

		<div id="webgpu-device-lost">
			<div id="webgpu-device-lost-box">
				<div id="webgpu-device-lost-message"></div>
				<button id="webgpu-device-lost-reload" type="button">Reload</button>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
// Force "Project" canvas sizing (a fixed buffer at the project's configured
// resolution, in CSS pixels via canvas.style.width/height) instead of the
// export preset's own canvasResizePolicy, so fitCanvasToViewport() below has
// a stable, known aspect ratio to scale -- see that function for the rest.
GODOT_CONFIG['canvasResizePolicy'] = 1;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// Per-stage loading screen text and visibility, from the export preset's
// "Loading Screen" section: { <stage>: { text, showText, showSpinner } }. The
// stage keys are listed in platform/web/export/export_plugin.cpp
// (web_loading_screen_stages); showStage() below is the only reader.
const GODOT_LOADING_SCREEN = $GODOT_LOADING_SCREEN;
// The preset's progress bar options (loading_screen/progress_bar/*): { enabled,
// customColors, borderColor, backgroundColor, fillColor }, colors as CSS hex.
const GODOT_PROGRESS_BAR = $GODOT_PROGRESS_BAR;
const GODOT_RENDERING_DRIVER = (GODOT_CONFIG['renderingDriver'] || '');
const engine = new Engine(GODOT_CONFIG);

// Scales #canvas up (or down) via a CSS transform to fill as much of the
// viewport as possible while preserving its aspect ratio, centered, without
// ever cropping or distorting it -- like CSS `object-fit: contain`, but via
// `transform: scale()` specifically so canvas.getBoundingClientRect() keeps
// exactly matching what's visually on screen (see the #canvas CSS rule's
// comment for why that distinction matters for mouse/touch input mapping).
// Reads canvas.style.width/height (the engine's own inline style, set to a
// fixed CSS-pixel size once canvasResizePolicy is forced to "Project" above)
// rather than getBoundingClientRect(), since that would otherwise read back
// this function's own previous transform and compound on every call.
(function () {
	const canvas = document.getElementById('canvas');
	canvas.style.position = 'fixed';
	canvas.style.left = '50%';
	canvas.style.top = '50%';
	canvas.style.transformOrigin = 'center center';

	function fitCanvasToViewport() {
		const nativeWidth = parseFloat(canvas.style.width);
		const nativeHeight = parseFloat(canvas.style.height);
		if (!nativeWidth || !nativeHeight) {
			return;
		}
		const scale = Math.min(window.innerWidth / nativeWidth, window.innerHeight / nativeHeight);
		canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
	}

	window.addEventListener('resize', fitCanvasToViewport);

	// The engine sets canvas.style.width/height asynchronously during startup
	// (once ProjectSettings' configured resolution is known); poll briefly
	// until that first happens, then stop -- canvasResizePolicy "Project"
	// keeps it constant afterward, so only window resizes need re-fitting.
	const fitPollId = setInterval(() => {
		if (canvas.style.width) {
			fitCanvasToViewport();
			clearInterval(fitPollId);
		}
	}, 50);
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLabel = document.getElementById('status-label');
	const webgpuSpinner = document.getElementById('webgpu-spinner');

	const progressBar = (typeof GODOT_PROGRESS_BAR === 'object' && GODOT_PROGRESS_BAR) || {};
	const progressBarEnabled = progressBar['enabled'] !== false;
	if (progressBar['customColors']) {
		statusProgress.style.setProperty('--progress-border-color', progressBar['borderColor']);
		statusProgress.style.setProperty('--progress-background-color', progressBar['backgroundColor']);
		statusProgress.style.setProperty('--progress-fill-color', progressBar['fillColor']);
		statusProgress.classList.add('custom-colors');
	}

	// The start screen (html/start_button/*, GODOT_CONFIG.startButton): the page
	// waits on this button, and nothing of the engine runs until it is pressed.
	const statusStart = document.getElementById('status-start');
	const startButton = GODOT_CONFIG['startButton'] || {};
	if (startButton['enabled']) {
		statusStart.textContent = startButton['text'] || 'Start';
		const startStyle = {
			'--start-background-color': startButton['backgroundColor'],
			'--start-hover-color': startButton['hoverColor'],
			'--start-pressed-color': startButton['pressedColor'],
			'--start-text-color': startButton['textColor'],
			'--start-border-color': startButton['borderColor'],
			'--start-border-width': `${startButton['borderWidth']}px`,
			'--start-border-radius': `${startButton['borderRadius']}px`,
			'--start-font-family': startButton['fontFamily'],
			'--start-font-size': `${startButton['fontSize']}px`,
			'--start-padding-horizontal': `${startButton['paddingHorizontal']}px`,
			'--start-padding-vertical': `${startButton['paddingVertical']}px`,
		};
		Object.entries(startStyle).forEach(([name, value]) => {
			statusStart.style.setProperty(name, value);
		});
	}

	// --- Unified loading progress -------------------------------------------------
	//
	// Downloading is only the first half of a Web load. Once the last byte has
	// arrived the engine still has to bring up its servers, register types and load
	// the main scene, and on a real project that takes longer than the download did --
	// which is why a download-only bar fills to 100% and then appears to freeze. The
	// bar below therefore covers both: downloads fill the first DOWNLOAD_SHARE of it,
	// the engine's own startup phases fill the rest.
	//
	// The engine reports each completed phase through the `onStartupProgress` config
	// callback (platform/web/os_web.cpp forwards `main.cpp`'s existing phase
	// brackets). The weights below are *approximate* costs in milliseconds, measured
	// on a real project -- see webgpu_notes/TASKS.md Task 14 for where they come from.
	// They do not need to be accurate to be useful; they only need to stop a 500 ms
	// phase and a 2 ms phase from advancing the bar by the same amount.
	//
	// Only leaf phases are listed. `main.cpp` also brackets wrappers around these
	// ("Startup:Servers", "Startup:Main::Setup2", "Startup:Main::Start"), and counting
	// those as well would double-count their children. Anything not listed -- a phase
	// from a future engine version, an editor-only one -- is simply ignored, so an
	// unknown name can never push the bar past 100%.
	// How much of the bar the download owns. Measured on a fast local connection the
	// download is ~450 ms against ~1150 ms of engine startup, so weighting it at half
	// the bar makes it race to the midpoint and then crawl. Over a slow link the
	// opposite is true and this understates it -- but a download segment that fills
	// slowly is a bar that keeps moving, whereas overweighting it reproduces exactly
	// the "100% then frozen" impression this whole change exists to remove. So the
	// error is deliberately biased towards the engine phases.
	const DOWNLOAD_SHARE = 0.35;

	// [phase name, weight, loading screen stage for the work that follows it]
	const STARTUP_PHASES = [
		['Startup:Main::Setup', 60, 'initializing_engine'],
		['Startup:Initialize Early Settings', 10, 'initializing_engine'],
		['Servers:Modules and Extensions', 30, 'loading_extensions'],
		['Servers:Input', 2, 'starting_display'],
		['Servers:Display', 5, 'starting_renderer'],
		['Servers:Rendering', 510, 'starting_audio'],
		['Servers:Audio', 30, 'starting_engine'],
		['Servers:XR', 1, 'starting_engine'],
		['Startup:Setup Window and Boot', 5, 'loading_translations'],
		['Startup:Translations and Remaps', 5, 'loading_fonts'],
		['Startup:Text Server', 20, 'registering_types'],
		['Startup:Scene', 110, 'registering_types'],
		['Startup:Platforms', 1, 'finalizing_setup'],
		['Startup:Finalize Setup', 10, 'loading_autoloads'],
		['Startup:Load Autoloads', 20, 'loading_main_scene'],
		['Startup:Load Game', 325, 'rendering_first_frame'],
		['Startup:First Frame', 150, ''],
	];

	const phaseWeightTotal = STARTUP_PHASES.reduce((sum, phase) => sum + phase[1], 0);
	const phaseIndex = new Map(STARTUP_PHASES.map((phase, i) => [phase[0], i]));
	const phasesSeen = new Set();
	let phaseWeightDone = 0;
	let downloadFraction = 0;
	let downloadIndeterminate = false;

	function updateProgressBar() {
		if (downloadIndeterminate && phaseWeightDone === 0) {
			// No content-length to work from and the engine has not started yet, so
			// there is genuinely nothing to report -- an indeterminate bar is honest.
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
			return;
		}
		const fraction = (downloadFraction * DOWNLOAD_SHARE)
			+ ((phaseWeightDone / phaseWeightTotal) * (1 - DOWNLOAD_SHARE));
		statusProgress.max = 1000;
		statusProgress.value = Math.round(Math.min(fraction, 1) * 1000);
	}

	function setStatusLabel(text) {
		statusLabel.textContent = text || '';
		statusLabel.classList.toggle('visible', !!text);
	}

	// Shows a loading screen stage: its configured text (plus `suffix`, for the
	// download percentage and the shader count) if the stage shows text, and the
	// spinner if the stage shows it. Both are decided per stage in the export
	// preset, so every transition sets both explicitly rather than inheriting the
	// previous stage's state. An element that no stage shows is removed from the
	// layout outright (see the .unused rule); otherwise a hidden one keeps its
	// box, so the bar sits still while stages come and go.
	const loadingStages = (typeof GODOT_LOADING_SCREEN === 'object' && GODOT_LOADING_SCREEN) || {};
	const stageList = Object.values(loadingStages);
	statusLabel.classList.toggle('unused', !stageList.some((stage) => stage['showText']));
	webgpuSpinner.classList.toggle('unused', !stageList.some((stage) => stage['showSpinner']));

	function showStage(key, suffix) {
		const stage = loadingStages[key];
		if (!stage) {
			console.warn(`Unknown loading screen stage "${key}".`);
			return;
		}
		setStatusLabel(stage['showText'] ? `${stage['text'] || ''}${suffix || ''}` : '');
		webgpuSpinner.classList.toggle('visible', !!stage['showSpinner']);
	}

	function onStartupProgress(name) {
		const index = phaseIndex.get(name);
		if (index === undefined || phasesSeen.has(name)) {
			return; // Unknown phase, or a repeat -- never move the bar backwards.
		}
		phasesSeen.add(name);
		if (name === 'Startup:First Frame') {
			// Terminal phase: the startup is over, so the bar is full by definition.
			// Accumulated weight alone stops a few points short, because not every
			// phase runs in every configuration (no XR, no autoloads, ...) and the
			// weights are fixed estimates.
			phaseWeightDone = phaseWeightTotal;
		} else {
			phaseWeightDone += STARTUP_PHASES[index][1];
		}
		// Downloads are necessarily finished by the time the engine is running, and a
		// download whose total was never known would otherwise leave that share of the
		// bar permanently empty.
		downloadFraction = 1;
		downloadIndeterminate = false;
		updateProgressBar();
		// Name the work that comes *next*, not the phase that just finished: this
		// callback paints during the gap before the next phase runs, so "what is it
		// doing right now" is the useful thing to show.
		const nextStage = STARTUP_PHASES[index][2];
		if (nextStage) {
			showStage(nextStage);
		}
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		// A disabled bar leaves the layout, so the rest of the column closes up.
		statusProgress.style.display = (mode === 'progress' && progressBarEnabled) ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusStart.style.display = mode === 'start' ? 'block' : 'none';
		// The label and spinner belong to progress mode only; in notice mode they
		// leave the layout rather than holding an empty slot above the error box.
		statusLabel.style.display = mode === 'progress' ? '' : 'none';
		webgpuSpinner.style.display = mode === 'progress' ? '' : 'none';
		if (mode !== 'progress') {
			setStatusLabel('');
			webgpuSpinner.classList.remove('visible');
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		webgpuSpinner.classList.remove('visible');
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// For "still working" stages during startup. This keeps the progress bar on
	// screen rather than replacing it with the notice box (which displayFailureNotice()
	// above owns, and which reads as an error): the engine now reports real progress
	// while it starts up, so hiding the bar at exactly the point it finally has
	// something to say would be the wrong trade. These stages default to showing
	// the spinner, because a phase that blocks for hundreds of milliseconds paints
	// nothing at all while it runs, and a compositor-driven CSS animation is the
	// only thing that keeps visibly moving through that (see the long comment below).
	function showBusyStage(key, suffix) {
		setStatusMode('progress');
		showStage(key, suffix);
	}

	// The WebGPU device can be lost well after startup (e.g. a GPU crash/driver
	// reset) -- there's no way for the engine to recover once that happens, so
	// just tell the player and offer a reload. Separate from the status overlay
	// above since that one is removed from the DOM once startup completes.
	const deviceLostOverlay = document.getElementById('webgpu-device-lost');
	const deviceLostMessage = document.getElementById('webgpu-device-lost-message');
	document.getElementById('webgpu-device-lost-reload').addEventListener('click', () => {
		window.location.reload();
	});
	function showDeviceLostOverlay(reason, message) {
		while (deviceLostMessage.lastChild) {
			deviceLostMessage.removeChild(deviceLostMessage.lastChild);
		}
		const lines = [`The graphics device was lost (${reason}).`, message, 'Reload the page to continue.'].filter((l) => !!l);
		lines.forEach((line) => {
			deviceLostMessage.appendChild(document.createTextNode(line));
			deviceLostMessage.appendChild(document.createElement('br'));
		});
		deviceLostOverlay.style.display = 'flex';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
		webgl: GODOT_RENDERING_DRIVER !== 'webgpu',
	});

	if (GODOT_RENDERING_DRIVER === 'webgpu' && (typeof navigator === 'undefined' || !navigator.gpu)) {
		missing.push('WebGPU (try Chrome, Edge, or Firefox)');
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// The startup, run at once or when the start screen's button is pressed.
		function startEngine() {
			setStatusMode('progress');
			// Show WebGPU initialization status if applicable.
			if (GODOT_RENDERING_DRIVER === 'webgpu') {
				showStage('initializing_webgpu');
			}

			// IMPORTANT (found the hard way): on WebGPU, the engine's first rendered
			// frame runs *synchronously inside* the WASM callMain() call -- after
			// `engine.startGame()`'s download/init work is done, but before its
			// promise resolves, before control ever returns to JS, and therefore
			// before the browser gets a chance to paint anything. On a cold shader
			// cache this single call can block the main thread for many seconds
			// (SPIR-V -> WGSL conversion for every specialized pipeline variant the
			// first frame needs; see webgpu_notes/TASKS.md §4.21 and Section 10
			// of webgpu_notes/TASKS.md §4.21). No JS-side progress text
			// or event listener can update the screen during that window -- the JS
			// thread that would run them is the same one that's blocked. Two
			// consequences, both handled below:
			//
			// 1. `engine.js`'s start() dispatches 'godot-before-callmain' right
			//    before that call and yields two animation frames first -- we use
			//    that instant (not, e.g., before startGame() is even called, which
			//    would show this notice before the download has even started) to
			//    show a "please wait, this can take a while" notice, so it's
			//    actually painted before the long synchronous call begins. Without
			//    that yield, DOM changes made here would be queued but never
			//    painted until *after* the block -- defeating the point.
			// 2. That notice needs a spinner driven by CSS animation only (see the
			//    #webgpu-spinner rule above), since a compositor-thread animation on
			//    `transform` keeps running even while the main JS thread is blocked
			//    -- it's the only feedback that can actually be seen during the
			//    stall itself, as opposed to before or after it.
			//
			// Separately, later frames (after the first) run one-per-requestAnimationFrame,
			// so the browser *does* get control back between them even if any one of
			// them individually blocks for a while recompiling further shaders --
			// hence still listening for the driver's per-compile signal and waiting
			// for a quiet period below, to keep the notice accurate for that tail.
			let firstFramePresented = false;
			let shaderCompileCount = 0;
			let lastShaderCompileTime = 0;
			// Set once the engine is about to run. The preloader can still report a
			// final progress callback after that point, and it must not pull the
			// text back to the download stage once "Starting engine" is on screen.
			let engineStarting = false;
			if (GODOT_RENDERING_DRIVER === 'webgpu') {
				window.addEventListener('godot-before-callmain', () => {
					engineStarting = true;
					showBusyStage('starting_engine');
				});
				window.addEventListener('godot-webgpu-first-frame', () => {
					firstFramePresented = true;
				});
				window.addEventListener('godot-webgpu-shader-compile', (event) => {
					shaderCompileCount = event.detail.misses;
					lastShaderCompileTime = performance.now();
					showBusyStage('compiling_shaders', ` (${shaderCompileCount})`);
				});
			}

			function waitForWebGPUReady() {
				return new Promise((resolve) => {
					const QUIET_PERIOD_MS = 800;
					const SAFETY_TIMEOUT_MS = 30000;
					const startTime = performance.now();
					function check() {
						const now = performance.now();
						const quiet = lastShaderCompileTime === 0 || (now - lastShaderCompileTime) > QUIET_PERIOD_MS;
						const timedOut = (now - startTime) > SAFETY_TIMEOUT_MS;
						if ((firstFramePresented && quiet) || timedOut) {
							resolve();
							return;
						}
						requestAnimationFrame(check);
					}
					requestAnimationFrame(check);
				});
			}

			engine.startGame({
				'onProgress': function (current, total) {
					setStatusMode('progress');
					if (current > 0 && total > 0) {
						downloadFraction = current / total;
						downloadIndeterminate = false;
						if (!engineStarting) {
							showStage('downloading', ` ${Math.round(downloadFraction * 100)}%`);
						}
					} else {
						// No usable content-length (chunked or compressed responses, or not
						// every download has started yet) -- see EngineConfig.onProgress.
						downloadIndeterminate = true;
						if (!engineStarting) {
							showStage('downloading');
						}
					}
					updateProgressBar();
				},
				'onStartupProgress': onStartupProgress,
				'onWebGPUDeviceLost': showDeviceLostOverlay,
			}).then(() => {
				if (GODOT_RENDERING_DRIVER !== 'webgpu') {
					setStatusMode('hidden');
					return;
				}
				waitForWebGPUReady().then(() => {
					setStatusMode('hidden');
				});
			}, displayFailureNotice);
		}

		// The start screen: wait for the player instead of starting straight away.
		// The button is not focused here: inside an iframe, that would scroll the
		// parent page to the game. A <button> takes Enter and Space once focused.
		if (startButton['enabled']) {
			setStatusMode('start');
			statusStart.addEventListener('click', () => {
				statusStart.disabled = true;
				startEngine();
			}, { once: true });
		} else {
			startEngine();
		}
	}
}());
		</script>
	</body>
</html>
