<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	/* Centered and scaled to fill as much of the viewport as possible while
	preserving aspect ratio -- see fitCanvasToViewport() below, which sets
	position/left/top/transform on this element at runtime. Deliberately
	NOT done via `object-fit: contain` on a width:100vw/height:100vh box:
	object-fit visually letterboxes the rendered content *inside* the
	element's box without shrinking the box itself, so canvas.getBoundingClientRect()
	(which platform/web/js/libs/library_godot_input.js's mouse/touch handlers use
	to map event coordinates into canvas space) would keep reporting the full,
	un-letterboxed box -- misaligning every click/tap by the letterbox gap.
	A CSS `transform: scale()` instead visually scales the element as a whole,
	so its bounding rect always matches exactly what's on screen and input
	mapping needs no changes. */
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Shown if the WebGPU device is lost mid-session (e.g. a GPU crash/reset).
   Separate from #status above since that overlay is removed from the DOM
   once startup finishes -- this can fire well after the game is running. */
#webgpu-device-lost {
	display: none;
	position: fixed;
	inset: 0;
	background-color: rgba(0, 0, 0, 0.75);
	z-index: 2;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

#webgpu-device-lost-box {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem 1.5rem;
	text-align: center;
	max-width: 30rem;
}

#webgpu-device-lost-reload {
	margin-top: 0.75rem;
	padding: 0.4rem 1.2rem;
	cursor: pointer;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="webgpu-device-lost">
			<div id="webgpu-device-lost-box">
				<div id="webgpu-device-lost-message"></div>
				<button id="webgpu-device-lost-reload" type="button">Reload</button>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
// Force "Project" canvas sizing (a fixed buffer at the project's configured
// resolution, in CSS pixels via canvas.style.width/height) instead of the
// export preset's own canvasResizePolicy, so fitCanvasToViewport() below has
// a stable, known aspect ratio to scale -- see that function for the rest.
GODOT_CONFIG['canvasResizePolicy'] = 1;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const GODOT_RENDERING_DRIVER = (GODOT_CONFIG['renderingDriver'] || '');
const engine = new Engine(GODOT_CONFIG);

// Scales #canvas up (or down) via a CSS transform to fill as much of the
// viewport as possible while preserving its aspect ratio, centered, without
// ever cropping or distorting it -- like CSS `object-fit: contain`, but via
// `transform: scale()` specifically so canvas.getBoundingClientRect() keeps
// exactly matching what's visually on screen (see the #canvas CSS rule's
// comment for why that distinction matters for mouse/touch input mapping).
// Reads canvas.style.width/height (the engine's own inline style, set to a
// fixed CSS-pixel size once canvasResizePolicy is forced to "Project" above)
// rather than getBoundingClientRect(), since that would otherwise read back
// this function's own previous transform and compound on every call.
(function () {
	const canvas = document.getElementById('canvas');
	canvas.style.position = 'fixed';
	canvas.style.left = '50%';
	canvas.style.top = '50%';
	canvas.style.transformOrigin = 'center center';

	function fitCanvasToViewport() {
		const nativeWidth = parseFloat(canvas.style.width);
		const nativeHeight = parseFloat(canvas.style.height);
		if (!nativeWidth || !nativeHeight) {
			return;
		}
		const scale = Math.min(window.innerWidth / nativeWidth, window.innerHeight / nativeHeight);
		canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
	}

	window.addEventListener('resize', fitCanvasToViewport);

	// The engine sets canvas.style.width/height asynchronously during startup
	// (once ProjectSettings' configured resolution is known); poll briefly
	// until that first happens, then stop -- canvasResizePolicy "Project"
	// keeps it constant afterward, so only window resizes need re-fitting.
	const fitPollId = setInterval(() => {
		if (canvas.style.width) {
			fitCanvasToViewport();
			clearInterval(fitPollId);
		}
	}, 50);
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// The WebGPU device can be lost well after startup (e.g. a GPU crash/driver
	// reset) -- there's no way for the engine to recover once that happens, so
	// just tell the player and offer a reload. Separate from the status overlay
	// above since that one is removed from the DOM once startup completes.
	const deviceLostOverlay = document.getElementById('webgpu-device-lost');
	const deviceLostMessage = document.getElementById('webgpu-device-lost-message');
	document.getElementById('webgpu-device-lost-reload').addEventListener('click', () => {
		window.location.reload();
	});
	function showDeviceLostOverlay(reason, message) {
		while (deviceLostMessage.lastChild) {
			deviceLostMessage.removeChild(deviceLostMessage.lastChild);
		}
		const lines = [`The graphics device was lost (${reason}).`, message, 'Reload the page to continue.'].filter((l) => !!l);
		lines.forEach((line) => {
			deviceLostMessage.appendChild(document.createTextNode(line));
			deviceLostMessage.appendChild(document.createElement('br'));
		});
		deviceLostOverlay.style.display = 'flex';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (GODOT_RENDERING_DRIVER === 'webgpu' && (typeof navigator === 'undefined' || !navigator.gpu)) {
		missing.push('WebGPU (try Chrome, Edge, or Firefox)');
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Show WebGPU initialization status if applicable.
		if (GODOT_RENDERING_DRIVER === 'webgpu') {
			setStatusNotice('Initializing WebGPU...');
			setStatusMode('notice');
		}

		// On WebGPU, `startGame()` resolving only means callMain() returned --
		// which happens well before the game is actually visible, since shader
		// compilation (SPIR-V -> WGSL via Tint) runs synchronously on the main
		// thread across many subsequent animation frames (up to several seconds
		// on a cold cache; see webgpu_notes/STARTUP_PROFILING.md). Hiding the
		// overlay right on that resolution -- as every other renderer here does,
		// correctly, since their startup really is done by then -- left a black,
		// apparently-frozen canvas for that whole window with no explanation.
		//
		// So for WebGPU specifically, wait for two extra signals dispatched from
		// the driver (drivers/webgpu/rendering_device_driver_webgpu.cpp) before
		// hiding: a frame has actually been presented, and no new shader compile
		// has happened for a short quiet period (compilation happens in bursts,
		// so a single frame without one doesn't mean it's finished).
		let firstFramePresented = false;
		let shaderCompileCount = 0;
		let lastShaderCompileTime = 0;
		if (GODOT_RENDERING_DRIVER === 'webgpu') {
			window.addEventListener('godot-webgpu-first-frame', () => {
				firstFramePresented = true;
			});
			window.addEventListener('godot-webgpu-shader-compile', (event) => {
				shaderCompileCount = event.detail.misses;
				lastShaderCompileTime = performance.now();
				setStatusMode('notice');
				setStatusNotice(`Compiling shaders... (${shaderCompileCount})`);
			});
		}

		function waitForWebGPUReady() {
			return new Promise((resolve) => {
				const QUIET_PERIOD_MS = 800;
				const SAFETY_TIMEOUT_MS = 30000;
				const startTime = performance.now();
				function check() {
					const now = performance.now();
					const quiet = lastShaderCompileTime === 0 || (now - lastShaderCompileTime) > QUIET_PERIOD_MS;
					const timedOut = (now - startTime) > SAFETY_TIMEOUT_MS;
					if ((firstFramePresented && quiet) || timedOut) {
						resolve();
						return;
					}
					requestAnimationFrame(check);
				}
				requestAnimationFrame(check);
			});
		}

		engine.startGame({
			'onProgress': function (current, total) {
				setStatusMode('progress');
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
			'onWebGPUDeviceLost': showDeviceLostOverlay,
		}).then(() => {
			if (GODOT_RENDERING_DRIVER !== 'webgpu') {
				setStatusMode('hidden');
				return;
			}
			setStatusNotice('Starting...');
			setStatusMode('notice');
			waitForWebGPUReady().then(() => {
				setStatusMode('hidden');
			});
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
