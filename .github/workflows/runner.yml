name: 🔗 GHA
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.
  # Gated on refs/heads/main so a manually-dispatched run on another branch is a no-op
  # (push events are already restricted to main above).

  static-checks:
    if: ${{ github.ref == 'refs/heads/main' && (!vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch') }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  android-build:
    name: 🤖 Android
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/android_builds.yml
    secrets:
      SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}

  ios-build:
    name: 🍏 iOS
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/ios_builds.yml

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/linux_builds.yml
    with:
      changed-files: ${{ needs.static-checks.outputs.changed-files }}

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/macos_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/windows_builds.yml

  web-build:
    name: 🌐 Web
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/web_builds.yml

  # Third stage: every build succeeded on main, so draft a release with all their artifacts.
  # A job with `needs` on this list only runs if every one of them succeeded (the default
  # behavior without an explicit always()/success() condition), so no extra guard is needed
  # beyond the branch restriction already enforced upstream via static-checks.

  draft-release:
    name: 📦 Draft release
    needs:
      - static-checks
      - android-build
      - ios-build
      - linux-build
      - macos-build
      - windows-build
      - web-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No submodules needed: this job only reads version.py and runs
        # misc/scripts/package_release_tpz.py against already-built artifacts.

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # The release ships exactly 4 files: one editor zip per desktop
      # platform, and one combined export-templates .tpz. Every other
      # downloaded artifact (mono/clang/sanitizer editor variants, mono/
      # minimal templates, per-arch Android jobs, etc.) is real, useful CI
      # output -- it stays available as a normal 60-day workflow artifact --
      # but was never meant to be end-user-facing, so it's deliberately not
      # attached to the release itself.
      - name: Zip editor artifacts
        working-directory: artifacts
        run: |
          for name in linux-editor macos-editor windows-editor; do
            if [[ -d "$name" ]]; then
              (cd "$name" && zip -qr "../${name}.zip" .)
            else
              echo "::warning::Editor artifact '$name' was not downloaded (its build job may have failed or been skipped) -- release will be missing this platform's editor."
            fi
          done

      - name: Resolve version string
        id: version
        run: |
          version="$(python3 - version.py <<'PYEOF'
          import sys
          ns = {}
          with open(sys.argv[1]) as f:
              exec(f.read(), ns)
          parts = [str(ns["major"]), str(ns["minor"])]
          if ns.get("patch"):
              parts.append(str(ns["patch"]))
          print(".".join(parts) + "." + ns["status"])
          PYEOF
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package combined export-templates .tpz
        run: |
          python3 misc/scripts/package_release_tpz.py \
            artifacts \
            "${{ steps.version.outputs.version }}" \
            "artifacts/godot-webgpu-export-templates-${{ steps.version.outputs.version }}.tpz"

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ github.sha }}
          name: main @ ${{ github.sha }}
          draft: true
          files: |
            artifacts/linux-editor.zip
            artifacts/macos-editor.zip
            artifacts/windows-editor.zip
            artifacts/godot-webgpu-export-templates-${{ steps.version.outputs.version }}.tpz
