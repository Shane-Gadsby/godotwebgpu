name: 🌐 Web Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    debug_symbols=no
    use_closure_compiler=yes
  EM_VERSION: 6.0.12

jobs:
  web-template:
    runs-on: ubuntu-26.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every web template is a WebGPU one (webgpu=yes opengl3=no), the same 8 variants
          # build-linux.sh builds: {threads, nothreads} x {dlink, no dlink} x {release, debug}.
          # The draft release packs them as web_[dlink_][nothreads_]{release,debug}.zip
          # (misc/scripts/package_release_tpz.py), the names the web export looks for.
          - name: Template WebGPU, threads (target=template_release, threads=yes, dlink_enabled=no)
            cache-name: web-template
            target: template_release
            scons-flags: threads=yes dlink_enabled=no webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, threads, debug (target=template_debug, threads=yes, dlink_enabled=no)
            cache-name: web-template-debug
            target: template_debug
            scons-flags: threads=yes dlink_enabled=no webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, no threads (target=template_release, threads=no, dlink_enabled=no)
            cache-name: web-nothreads-template
            target: template_release
            scons-flags: threads=no dlink_enabled=no webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, no threads, debug (target=template_debug, threads=no, dlink_enabled=no)
            cache-name: web-nothreads-template-debug
            target: template_debug
            scons-flags: threads=no dlink_enabled=no webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, threads, dlink (target=template_release, threads=yes, dlink_enabled=yes)
            cache-name: web-dlink-template
            target: template_release
            scons-flags: threads=yes dlink_enabled=yes webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, threads, dlink, debug (target=template_debug, threads=yes, dlink_enabled=yes)
            cache-name: web-dlink-template-debug
            target: template_debug
            scons-flags: threads=yes dlink_enabled=yes webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, no threads, dlink (target=template_release, threads=no, dlink_enabled=yes)
            cache-name: web-dlink-nothreads-template
            target: template_release
            scons-flags: threads=no dlink_enabled=yes webgpu=yes opengl3=no
            artifact: true
            webgpu: true

          - name: Template WebGPU, no threads, dlink, debug (target=template_debug, threads=no, dlink_enabled=yes)
            cache-name: web-dlink-nothreads-template-debug
            target: template_debug
            scons-flags: threads=no dlink_enabled=yes webgpu=yes opengl3=no
            artifact: true
            webgpu: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Emscripten latest
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      # Applies whatever Emscripten patch this version still needs (none on 6.0.12).
      # setup-emsdk above lays down a fresh toolchain tree every run, so it has to
      # run here. See misc/emsdk_patches/README.md.
      #
      # Run for every web job, not just the dlink ones: it is harmless for the
      # others (neither patched code path is taken without -sSIDE_MODULE /
      # -sEXPORT_ALL), and gating it on the matrix means a future dlink entry that
      # forgets the gate silently builds an unpatched template -- the exact
      # silent-failure shape this directory exists to prevent.
      #
      # Deliberately fatal on refusal. apply.sh exits 3 when upstream has changed
      # the text a patch pins, which can only happen here by bumping EM_VERSION in
      # this same file -- and that bump requires re-deriving the patches anyway.
      # One loud, named failure now beats discovering it from a broken export later.
      - name: Apply Emscripten toolchain patches
        run: ./misc/emsdk_patches/apply.sh --apply

      - name: Verify Emscripten toolchain patches are applied
        run: ./misc/emsdk_patches/apply.sh --status

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # webgpu=yes builds run wgsl_precompile.py at build time (compiling every
      # engine shader variant GLSL -> SPIR-V -> WGSL ahead of time), which shells
      # out to glslangValidator; it isn't preinstalled on the runner image.
      - name: Install glslangValidator
        if: matrix.webgpu
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: web
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: ${{ matrix.cache-name }}
