name: 🍎 macOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: macos-editor
            target: editor

          - name: Template (target=template_release + template_debug)
            cache-name: macos-template
            target: template_release
            debug-target: template_debug
            scons-flags: debug_symbols=no

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      # Template bundling (below) needs BOTH template_debug and
      # template_release binaries present in bin/ at once -- see
      # platform_macos_builders.py's generate_bundle(), which lipos and
      # packages both into a single macos_template.app/.zip. debug_symbols
      # is deliberately left at its default (yes) here, unlike the release
      # target's matrix.scons-flags, so the debug template stays useful for
      # debugging exported projects.
      - name: Compilation (x86_64, debug target)
        if: matrix.debug-target
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.debug-target }}

      - name: Compilation (arm64, debug target)
        if: matrix.debug-target
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.debug-target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      # Runs against the raw per-arch arm64 binary (macos-26 runners are
      # Apple Silicon, so this runs natively -- no Rosetta needed), before
      # the bundle step below consumes/removes it. Bundling produces a real
      # .app (whose binary is at a version-derived path) or, for templates,
      # a zip with no standalone binary left on disk at all (see
      # generate_bundle()'s final shutil.rmtree), so testing post-bundle
      # would need unzipping either way -- simpler and just as meaningful to
      # smoke-test the plain arch binary here instead.
      - name: Unit tests
        run: |
          ./bin/godot.macos.${{ matrix.target }}.arm64 --version
          ./bin/godot.macos.${{ matrix.target }}.arm64 --help
          ./bin/godot.macos.${{ matrix.target }}.arm64 --test --force-colors

      # Assembles a real .app bundle (editor) or a macos_template.app zipped
      # as godot_macos*.zip (template, containing both debug+release Godot
      # binaries -- see platform_macos_builders.py's generate_bundle()),
      # universal (lipo'd x86_64+arm64) either way. This is a from-scratch
      # SCons invocation, but the actual compile is already done above --
      # this one only exercises the bundling Command(), which finds the
      # already-built per-arch binaries in bin/ by filename. Unsigned
      # (bundle_sign_identity defaults to "-", i.e. ad-hoc signing -- no
      # certificate needed, just enough for the bundle to launch locally
      # without extra Gatekeeper friction beyond the usual unsigned-download
      # warning; real notarization needs a paid Apple Developer identity
      # this repo doesn't have as a CI secret).
      - name: Generate .app bundle
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} generate_bundle=yes
          platform: macos
          target: ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          # generate_bundle already produced a ready-to-ship .app (editor) or
          # godot_macos*.zip (template, already containing both debug+release
          # universal binaries) directly in bin/ -- drop the raw per-arch
          # intermediate binaries so only the bundle/zip gets uploaded.
          rm -f ./bin/godot.macos.*.x86_64 ./bin/godot.macos.*.arm64
          rm -rf ./bin/build_deps

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}
          path: ${{ matrix.target == 'editor' && 'bin/*.app' || 'bin/godot_macos*.zip' }}
