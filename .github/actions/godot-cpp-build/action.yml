name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: Work around 'ar' argument list length limit on Linux
      shell: python
      run: |
        # godot-cpp's Linux tool doesn't wrap ARCOM in TEMPFILE like its web/Windows
        # tools do, so archiving libgodot-cpp.a (one .o per bound class) can exceed
        # the OS argument list limit. Apply the same TEMPFILE(ARCOM_POSIX) workaround
        # web.py already uses, right before the shared compiler flags are applied.
        path = "godot-cpp/tools/linux.py"
        with open(path) as f:
            content = f.read()
        marker = "    common_compiler_flags.generate(env)"
        assert marker in content, "godot-cpp/tools/linux.py layout changed; update this workaround"
        patch = (
            '    env["ARCOM_POSIX"] = env["ARCOM"].replace("$TARGET", "$TARGET.posix").replace("$SOURCES", "$SOURCES.posix")\n'
            '    env["ARCOM"] = "${TEMPFILE(ARCOM_POSIX)}"\n\n'
        )
        content = content.replace(marker, patch + marker, 1)
        with open(path, "w") as f:
            f.write(content)

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./godot-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
